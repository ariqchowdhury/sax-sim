[package]
name = "sax_engine"
version = "0.1.0"
edition = "2021"
description = "First-principles real-time alto saxophone + player physical model"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "render"
path = "src/bin/render.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native release (render, examples, `cargo test --release`): unwinding panics so
# the test harness links (panic="abort" + lto collided with it).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# The AudioWorklet build (engine/build_wasm.sh: `--profile wasm`): release +
# panic="abort" — no unwinding tables in the .wasm.
[profile.wasm]
inherits = "release"
panic = "abort"

# `cargo test` uses the dev/test profile; keep it optimised so the engine-level
# tests run quickly.
[profile.dev]
opt-level = 3
debug-assertions = true
overflow-checks = true
