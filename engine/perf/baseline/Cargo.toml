[package]
name = "sax_engine"
version = "0.1.0"
edition = "2021"
description = "First-principles real-time alto saxophone + player physical model"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "render"
path = "src/bin/render.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

# `cargo test` uses the dev/test profile (the release profile's panic="abort"
# collides with the unwinding test harness); keep it optimised so the
# engine-level tests run quickly.
[profile.dev]
opt-level = 3
debug-assertions = true
overflow-checks = true
